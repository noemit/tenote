<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF4"/>
      <stop offset="0.55" stop-color="#FAF3DF"/>
      <stop offset="1" stop-color="#F3E8CB"/>
    </linearGradient>

    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8D8B2"/>
      <stop offset="1" stop-color="#DEC9A0"/>
    </linearGradient>

    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>


    <clipPath id="note">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>

    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#5E4C2C" flood-opacity="0.26"/>
    </filter>
  </defs>

  <!-- the note: soft shadow + warm paper -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#paper)" filter="url(#shadow)"/>

  <g clip-path="url(#note)">

    <!-- gentle sheen, under the dots -->
    <rect x="100" y="100" width="824" height="824" fill="url(#gloss)"/>

    <!-- 4 x 4 dotted paper -->
    <g fill="#C79A4A" opacity="0.62">
      <circle cx="233.0" cy="233.0" r="40"/>
      <circle cx="419.0" cy="233.0" r="40"/>
      <circle cx="605.0" cy="233.0" r="40"/>
      <circle cx="791.0" cy="233.0" r="40"/>
      <circle cx="233.0" cy="419.0" r="40"/>
      <circle cx="419.0" cy="419.0" r="40"/>
      <circle cx="605.0" cy="419.0" r="40"/>
      <circle cx="791.0" cy="419.0" r="40"/>
      <circle cx="233.0" cy="605.0" r="40"/>
      <circle cx="419.0" cy="605.0" r="40"/>
      <circle cx="605.0" cy="605.0" r="40"/>
      <circle cx="791.0" cy="605.0" r="40"/>
      <circle cx="233.0" cy="791.0" r="40"/>
      <circle cx="419.0" cy="791.0" r="40"/>
      <circle cx="605.0" cy="791.0" r="40"/>
      <circle cx="791.0" cy="791.0" r="40"/>
    </g>

    <!-- folded bottom-right corner -->
    <path d="M924 764 L924 924 L764 924 Z" fill="url(#fold)"/>
    <path d="M764 924 L924 764 L924 788 L788 924 Z" fill="#FBF2DC" opacity="0.55"/>
  </g>

  <!-- top highlight + a quiet edge so it holds on white -->
  <rect x="103" y="103" width="818" height="818" rx="182" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="4" clip-path="url(#note)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none"
        stroke="#D9C9A4" stroke-opacity="0.38" stroke-width="3"/>
</svg>
