<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF9DA"/>
      <stop offset="0.55" stop-color="#FFF0A6"/>
      <stop offset="1" stop-color="#FFE071"/>
    </linearGradient>

    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8CE63"/>
      <stop offset="1" stop-color="#EEC04A"/>
    </linearGradient>

    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>


    <clipPath id="note">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>

    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#6B4E00" flood-opacity="0.26"/>
    </filter>
  </defs>

  <!-- the note: soft shadow + warm paper -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#paper)" filter="url(#shadow)"/>

  <g clip-path="url(#note)">
    <!-- 5 x 5 dotted paper -->
    <g fill="#C08A22" opacity="0.75">
      <circle cx="214.4" cy="214.4" r="24"/>
      <circle cx="363.2" cy="214.4" r="24"/>
      <circle cx="512.0" cy="214.4" r="24"/>
      <circle cx="660.8" cy="214.4" r="24"/>
      <circle cx="809.6" cy="214.4" r="24"/>
      <circle cx="214.4" cy="363.2" r="24"/>
      <circle cx="363.2" cy="363.2" r="24"/>
      <circle cx="512.0" cy="363.2" r="24"/>
      <circle cx="660.8" cy="363.2" r="24"/>
      <circle cx="809.6" cy="363.2" r="24"/>
      <circle cx="214.4" cy="512.0" r="24"/>
      <circle cx="363.2" cy="512.0" r="24"/>
      <circle cx="512.0" cy="512.0" r="24"/>
      <circle cx="660.8" cy="512.0" r="24"/>
      <circle cx="809.6" cy="512.0" r="24"/>
      <circle cx="214.4" cy="660.8" r="24"/>
      <circle cx="363.2" cy="660.8" r="24"/>
      <circle cx="512.0" cy="660.8" r="24"/>
      <circle cx="660.8" cy="660.8" r="24"/>
      <circle cx="809.6" cy="660.8" r="24"/>
      <circle cx="214.4" cy="809.6" r="24"/>
      <circle cx="363.2" cy="809.6" r="24"/>
      <circle cx="512.0" cy="809.6" r="24"/>
      <circle cx="660.8" cy="809.6" r="24"/>
      <circle cx="809.6" cy="809.6" r="24"/>
    </g>

    <!-- light from the top -->
    <rect x="100" y="100" width="824" height="260" fill="url(#gloss)"/>

    <!-- folded bottom-right corner -->
    <path d="M924 764 L924 924 L764 924 Z" fill="url(#fold)"/>
    <path d="M764 924 L924 764 L924 788 L788 924 Z" fill="#FFEFC0" opacity="0.55"/>
  </g>

  <!-- top highlight + a quiet edge so it holds on white -->
  <rect x="103" y="103" width="818" height="818" rx="182" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="4" clip-path="url(#note)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none"
        stroke="#E3BA4C" stroke-opacity="0.38" stroke-width="3"/>
</svg>
