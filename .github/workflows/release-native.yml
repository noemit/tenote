name: Release Tenote Native

on:
  push:
    tags:
      - 'native-v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. native-v2.0.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

      - name: Check tag matches VERSION
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          if [[ "$TAG" != "native-v$v" ]]; then
            echo "tag $TAG does not match VERSION (native-v$v)"
            exit 1
          fi
          echo "RELEASE_NAME=Tenote Native $v" >> "$GITHUB_ENV"

      - name: Test
        run: swift test

      - name: Check signing secrets
        env:
          CERT: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          check() {
            if [[ -z "${!1}" ]]; then
              echo "::error::$2 is empty — add it in Settings → Secrets and variables → Actions"
              missing=1
            else
              echo "$2 is set"
            fi
          }
          check CERT APPLE_DEVELOPER_ID_CERTIFICATE
          check CERT_PASSWORD APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD
          check APPLE_ID APPLE_ID
          check APPLE_APP_SPECIFIC_PASSWORD APPLE_APP_SPECIFIC_PASSWORD
          check APPLE_TEAM_ID APPLE_TEAM_ID
          exit $missing

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)
          if [[ -z "$IDENTITY" ]]; then echo "no Developer ID Application identity in the cert"; exit 1; fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: packaging/build-app.sh --dist

      # A missing/expired identity or failed notarization must stop the release.
      - name: Verify signature and notarization
        run: |
          APP="dist/Tenote Native.app"
          codesign --verify --deep --strict "$APP"
          spctl -a -vvv --type execute "$APP"
          xcrun stapler validate "$APP"
          for f in dist/TenoteNative-*.dmg; do xcrun stapler validate "$f"; done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          name: ${{ env.RELEASE_NAME }}
          files: |
            dist/TenoteNative-*.dmg
            dist/TenoteNative-*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
