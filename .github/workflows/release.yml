name: Release Tenote (legacy Electron, frozen)

# Electron is frozen at 1.3.x. This workflow is manual-only: pushing a v* tag
# no longer publishes an Electron build. The shipping app is Tenote Native
# (see release-native.yml).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v1.3.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run checks and tests
        run: |
          npm run check
          npm test

      - name: Build, sign and notarize
        env:
          CSC_LINK: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist

      # Fail loudly instead of publishing an unsigned build.
      - name: Verify signature and notarization
        run: |
          APP="$(ls -d dist/mac*/Tenote.app | head -1)"
          test -n "$APP" || { echo "no Tenote.app produced"; exit 1; }
          codesign --verify --deep --strict "$APP"
          spctl -a -vvv --type execute "$APP"
          xcrun stapler validate "$APP"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Tenote ${{ inputs.tag }} (legacy Electron)
          files: |
            dist/Tenote-*.dmg
            dist/Tenote-*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
