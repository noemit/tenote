name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  electron:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run check
      - run: npm test

  native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Package (ad-hoc signed)
        run: packaging/build-app.sh
      - name: Check bundle contents
        run: |
          R="dist/Tenote Native.app/Contents/Resources"
          for p in renderer/index.html examples plugins assets/icon.png AppIcon.icns VERSION; do
            test -e "$R/$p" || { echo "missing $p"; exit 1; }
          done

      - name: Build Mac App Store variant (unsigned)
        run: packaging/build-mas.sh --build-only

      - name: Check MAS bundle
        run: |
          APP="dist/Tenote.app"
          R="$APP/Contents/Resources"
          test -f "$R/PrivacyInfo.xcprivacy"
          test -f "$R/plugins/builtin/core-commands/index.js"
          test ! -d "$R/examples"
          test ! -d "$R/plugins/user"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = "com.tenote.native.mas"
      - uses: actions/upload-artifact@v4
        with:
          name: Tenote-Native.app
          path: dist/Tenote Native.app
