name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Package (ad-hoc signed)
        run: packaging/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Tenote.app
          path: dist/Tenote.app
