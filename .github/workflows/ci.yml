name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  electron:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run check
      - run: npm test

  native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Package (ad-hoc signed)
        run: packaging/build-app.sh
      - name: Check bundle contents
        run: |
          R="dist/Tenote Native.app/Contents/Resources"
          for p in renderer/index.html examples plugins assets/icon.png AppIcon.icns VERSION; do
            test -e "$R/$p" || { echo "missing $p"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Tenote-Native.app
          path: dist/Tenote Native.app
